<!DOCTYPE html>
<html>
<head>
    <title>Upload to Google Drive</title>
</head>
<body>
    <h2>Upload File to Google Drive</h2>
    <input type="file" id="fileInput">
    <button onclick="uploadFile()">Upload</button>
    <pre id="result"></pre>

    <script>
        // Use the tokens you got from your successful Node.js test
        const ACCESS_TOKEN = 'ya29.a0Aa7MYipGw2cHxWXXyYaHNLciUuVh_7752IF6XMG5hxsumHlgyovXHCJs79qzKwMOS-AS-7cx9L1hfEmthKYjbALocvKpVQF7SGB_gTuorirLWky3GIzZeoqvpPTxGutIwO_Tk2OK1LjSs2f9P0wLC04zLaBvSSoxE5X8efSM8rxQp7dDGjX_tBoEKBflfZ2XRlA7qDUaCgYKAVUSARISFQHGX2MiyKkrjMLM2cQ4unHpx67VZQ0206';
        
        async function uploadFile() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) {
                alert('Select a file first');
                return;
            }
            
            document.getElementById('result').innerText = 'Uploading...';
            
            const metadata = { name: file.name };
            const form = new FormData();
            form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
            form.append('file', file);
            
            try {
                const response = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${ACCESS_TOKEN}` },
                    body: form
                });
                
                const data = await response.json();
                if (response.ok) {
                    document.getElementById('result').innerText = `✅ Uploaded! File ID: ${data.id}`;
                } else {
                    document.getElementById('result').innerText = `❌ Error: ${data.error?.message}`;
                }
            } catch (error) {
                document.getElementById('result').innerText = `❌ Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
